<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Music Player</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#141e30,#243b55);
      color:white;
    }

    .player{
      width:350px;
      background:#1f1f1f;
      padding:25px;
      border-radius:20px;
      box-shadow:0 10px 25px rgba(0,0,0,0.4);
      animation:fadeIn 1s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .cover{
      width:100%;
      height:250px;
      border-radius:15px;
      overflow:hidden;
      margin-bottom:20px;
    }

    .cover img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .song-info{
      text-align:center;
      margin-bottom:20px;
    }

    .song-info h2{
      font-size:24px;
      margin-bottom:5px;
    }

    .song-info p{
      color:#bbb;
      font-size:16px;
    }

    /* Progress Bar */
    .progress-container{
      width:100%;
      height:6px;
      background:#444;
      border-radius:10px;
      cursor:pointer;
      margin:15px 0;
    }

    .progress{
      width:0%;
      height:100%;
      background:#1db954;
      border-radius:10px;
    }

    .time{
      display:flex;
      justify-content:space-between;
      font-size:13px;
      margin-bottom:15px;
      color:#ccc;
    }

    /* Controls */
    .controls{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:20px;
      margin-bottom:20px;
    }

    .controls button{
      border:none;
      background:#1db954;
      color:white;
      width:55px;
      height:55px;
      border-radius:50%;
      font-size:20px;
      cursor:pointer;
      transition:0.3s;
    }

    .controls button:hover{
      transform:scale(1.1);
      background:#17a74a;
    }

    /* Volume */
    .volume{
      margin-bottom:20px;
    }

    .volume label{
      display:block;
      margin-bottom:8px;
    }

    input[type="range"]{
      width:100%;
      cursor:pointer;
    }

    /* Playlist */
    .playlist{
      margin-top:10px;
    }

    .playlist h3{
      margin-bottom:10px;
    }

    .playlist ul{
      list-style:none;
      max-height:120px;
      overflow-y:auto;
    }

    .playlist li{
      padding:10px;
      background:#2d2d2d;
      margin-bottom:8px;
      border-radius:10px;
      cursor:pointer;
      transition:0.3s;
    }

    .playlist li:hover{
      background:#1db954;
    }

    .active-song{
      background:#1db954 !important;
    }

    @media(max-width:400px){

      .player{
        width:95%;
      }

      .controls{
        gap:15px;
      }

      .controls button{
        width:50px;
        height:50px;
      }
    }

  </style>
</head>

<body>

  <div class="player">

    <!-- Album Cover -->
    <div class="cover">
      <img id="cover" src="https://picsum.photos/400/300" alt="cover">
    </div>

    <!-- Song Info -->
    <div class="song-info">
      <h2 id="title">Song Title</h2>
      <p id="artist">Artist Name</p>
    </div>

    <!-- Progress Bar -->
    <div class="progress-container" id="progress-container">
      <div class="progress" id="progress"></div>
    </div>

    <div class="time">
      <span id="current-time">0:00</span>
      <span id="duration">0:00</span>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button id="prev">⏮</button>
      <button id="play">▶</button>
      <button id="next">⏭</button>
    </div>

    <!-- Volume -->
    <div class="volume">
      <label>Volume</label>
      <input type="range" id="volume" min="0" max="1" step="0.1" value="1">
    </div>

    <!-- Playlist -->
    <div class="playlist">
      <h3>Playlist</h3>

      <ul id="playlist">
      </ul>
    </div>

    <!-- Audio -->
    <audio id="audio"></audio>

  </div>

  <script>

    const songs = [

      {
        title:"Dreams",
        artist:"Artist One",
        src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
        cover:"https://picsum.photos/id/237/400/300"
      },

      {
        title:"Night Sky",
        artist:"Artist Two",
        src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
        cover:"https://picsum.photos/id/238/400/300"
      },

      {
        title:"Chill Beats",
        artist:"Artist Three",
        src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
        cover:"https://picsum.photos/id/239/400/300"
      }

    ];

    const audio = document.getElementById("audio");

    const playBtn = document.getElementById("play");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");

    const title = document.getElementById("title");
    const artist = document.getElementById("artist");
    const cover = document.getElementById("cover");

    const progress = document.getElementById("progress");
    const progressContainer = document.getElementById("progress-container");

    const currentTimeEl = document.getElementById("current-time");
    const durationEl = document.getElementById("duration");

    const volume = document.getElementById("volume");

    const playlist = document.getElementById("playlist");

    let songIndex = 0;
    let isPlaying = false;

    // Load Song
    function loadSong(song){

      title.innerText = song.title;
      artist.innerText = song.artist;

      audio.src = song.src;
      cover.src = song.cover;

      updatePlaylistActive();
    }

    loadSong(songs[songIndex]);

    // Play Song
    function playSong(){

      isPlaying = true;

      audio.play();

      playBtn.innerText = "⏸";
    }

    // Pause Song
    function pauseSong(){

      isPlaying = false;

      audio.pause();

      playBtn.innerText = "▶";
    }

    // Play / Pause Toggle
    playBtn.addEventListener("click",()=>{

      if(isPlaying){
        pauseSong();
      }
      else{
        playSong();
      }
    });

    // Next Song
    function nextSong(){

      songIndex++;

      if(songIndex > songs.length - 1){
        songIndex = 0;
      }

      loadSong(songs[songIndex]);

      playSong();
    }

    // Previous Song
    function prevSong(){

      songIndex--;

      if(songIndex < 0){
        songIndex = songs.length - 1;
      }

      loadSong(songs[songIndex]);

      playSong();
    }

    nextBtn.addEventListener("click",nextSong);

    prevBtn.addEventListener("click",prevSong);

    // Update Progress Bar
    audio.addEventListener("timeupdate",(e)=>{

      const {duration,currentTime} = e.srcElement;

      const progressPercent = (currentTime / duration) * 100;

      progress.style.width = `${progressPercent}%`;

      // Current Time
      let currentMinutes = Math.floor(currentTime / 60);
      let currentSeconds = Math.floor(currentTime % 60);

      if(currentSeconds < 10){
        currentSeconds = "0" + currentSeconds;
      }

      currentTimeEl.innerText =
        `${currentMinutes}:${currentSeconds}`;

      // Duration
      let durationMinutes = Math.floor(duration / 60);
      let durationSeconds = Math.floor(duration % 60);

      if(durationSeconds < 10){
        durationSeconds = "0" + durationSeconds;
      }

      if(durationSeconds){
        durationEl.innerText =
          `${durationMinutes}:${durationSeconds}`;
      }

    });

    // Change Progress Position
    progressContainer.addEventListener("click",(e)=>{

      const width = progressContainer.clientWidth;

      const clickX = e.offsetX;

      const duration = audio.duration;

      audio.currentTime = (clickX / width) * duration;

    });

    // Volume Control
    volume.addEventListener("input",()=>{

      audio.volume = volume.value;

    });

    // Autoplay Next Song
    audio.addEventListener("ended",nextSong);

    // Playlist
    function createPlaylist(){

      songs.forEach((song,index)=>{

        const li = document.createElement("li");

        li.innerText =
          `${song.title} - ${song.artist}`;

        li.addEventListener("click",()=>{

          songIndex = index;

          loadSong(songs[songIndex]);

          playSong();

        });

        playlist.appendChild(li);

      });

    }

    createPlaylist();

    // Active Playlist Item
    function updatePlaylistActive(){

      const items = playlist.querySelectorAll("li");

      items.forEach((item,index)=>{

        item.classList.remove("active-song");

        if(index === songIndex){
          item.classList.add("active-song");
        }

      });

    }

  </script>

</body>
</html>
